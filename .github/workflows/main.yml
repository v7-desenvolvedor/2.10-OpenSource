name: Build Android Projeto GTA

on:
  push:
    branches: [ "free", "master" ]
  pull_request:
    branches: [ "free", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # JDK 17 é o padrão mais seguro para NDK 26
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK 26
        run: |
          # Instalando a versão exata da revisão 26.1.10909125
          sdkmanager "ndk;26.1.10909125"
          # Seta o caminho correto baseado na versão instalada acima
          echo "ANDROID_NDK_HOME=${{ env.ANDROID_HOME }}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: Compilar APK (.so + APK)
        run: ./gradlew assembleDebug

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: gta-mobile-build
          path: app/build/outputs/apk/debug/*.apk
